# Modell-Registry. Neue Modelle = neuer Eintrag, kein Code nötig (solange ein Adapter-Typ passt).
# type: stats   -> statsforecast-Klasse (class, params)
# type: chronos -> lokales Chronos-Verzeichnis (path), family: bolt | t5 | chronos2
# type: tirex2  -> lokales TiRex-2-Verzeichnis (path: model-config.yaml + model.ckpt)
# type: timestral -> lokales Timestral-Verzeichnis (path: config.json + model.safetensors)
baseline: seasonal_naive            # Vergleichsmodell für die Validierung ("muss die Baseline schlagen")
default_candidates:                 # was bei models: ["auto"] getestet wird
  - seasonal_naive
  - auto_ets
  - theta
  - chronos_bolt_small
  - tirex_2

intermittent_candidates:            # kommen bei auto dazu, sobald die Eingabe intermittierende Serien enthält (ADI >= 1,32)
  - croston_sba
  - tsb
  - imapa
  - adida

models:
  seasonal_naive: {type: stats, class: SeasonalNaive}
  naive:          {type: stats, class: Naive}
  historic_average: {type: stats, class: HistoricAverage}
  auto_ets:       {type: stats, class: AutoETS}
  auto_arima:     {type: stats, class: AutoARIMA}
  theta:          {type: stats, class: AutoTheta}
  # Sporadische Nachfrage (Ersatzteile, C-Teile). Alle ohne Prognoseintervalle (lo/hi leer).
  croston:        {type: stats, class: CrostonClassic}
  croston_sba:    {type: stats, class: CrostonSBA}          # Syntetos-Boylan-Korrektur, meist besser als klassisches Croston
  tsb:            {type: stats, class: TSB, params: {alpha_d: 0.2, alpha_p: 0.2}}   # Teunter-Syntetos-Babai, erkennt auslaufende Nachfrage
  imapa:          {type: stats, class: IMAPA}               # aggregiert über mehrere Zeitebenen
  adida:          {type: stats, class: ADIDA}

  # Gewichte vorher lokal ablegen (siehe README), HF_HUB_OFFLINE=1 im Container.
  chronos_bolt_tiny:  {type: chronos, family: bolt,     path: /models/chronos-bolt-tiny}
  chronos_bolt_small: {type: chronos, family: bolt,     path: /models/chronos-bolt-small}
  chronos_bolt_base:  {type: chronos, family: bolt,     path: /models/chronos-bolt-base}
  chronos_2:          {type: chronos, family: chronos2, path: /models/chronos-2}

  # TiRex-2 (NXAI, Apache-2.0). device: cpu ist der sichere Standard. Für cuda braucht das Image
  # ein CUDA Toolkit mit nvcc (passend zu PyTorch) und eine GPU mit Compute Capability >= 8.0.
  tirex_2:            {type: tirex2, path: /models/tirex-2, device: cpu}

  # Timestral (Mistral AI; Code Apache-2.0, Gewichte "Modified MIT license" – Lizenztext vor dem Einsatz lesen).
  # Im Repository KEIN Standardkandidat (default_candidates): Die Gewichte haben eine Umsatzgrenze (Modified MIT, 20 Mio. USD
  # globaler Monatsumsatz des nutzenden Unternehmens, siehe THIRD_PARTY.md). Wer sie einhält, trägt timestral_28m selbst unter
  # default_candidates ein, am besten nach dem eigenen Benchmark (live/benchmark.py).
  # Aufruf bis dahin mit models: ["timestral_28m"] oder ["auto", "timestral_28m"] (auto plus dieses Modell). Kovariaten: Past, Known-Future, je nach
  # Checkpoint (steht in config.json, wird zur Laufzeit gelesen). symmetric_averaging: false halbiert die Rechenzeit.
  timestral_28m:      {type: timestral, path: /models/timestral-28m,  device: cpu}
  timestral_209m:     {type: timestral, path: /models/timestral-209m, device: cpu}
